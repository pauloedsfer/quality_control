<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#EDF2F7;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:16px 12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.hdr{background:#1A3A5C;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;border-bottom:2px solid #E2E8F0;overflow-x:auto;background:#fff}
.tab{flex:1;min-width:90px;padding:11px 8px;border:none;background:transparent;font-size:12px;color:#718096;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
.tab.on{color:#1A3A5C;font-weight:700;border-bottom-color:#1A3A5C}
.body{padding:18px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{opacity:.85}
.bp{background:#1A3A5C;color:#fff}.bg{background:#EBF4FB;border:1px solid #BEE3F8;color:#1A3A5C}
.bd{background:#FFF5F5;border:1px solid #FEB2B2;color:#9B2C2C}.bsm{padding:5px 10px;font-size:12px}
.sec{border-radius:8px;padding:12px 14px;margin-bottom:12px}
.s1{background:#EBF4FB}.s2{background:#F0FFF4}.s3{background:#FFFFF0}.s4{background:#FFF5F5}.s5{background:#F7FAFC}
.stl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:700;color:#4A5568;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.fld{margin-bottom:10px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #CBD5E0;border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:#fff}
input:focus,select:focus{border-color:#2B6CB0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EEF2F7}
.cr:last-child{border-bottom:none}
.cl{flex:1;font-size:13px}.rg{display:flex;gap:10px}
.rg label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;white-space:nowrap;color:#4A5568}
.rg input{width:auto;margin:0}
.tb{border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.tb .tn{font-weight:700;font-size:12px;color:#2D3748;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid #CBD5E0;font-size:12px;cursor:pointer;background:#fff}
.tag input{width:auto;margin:0}.tag.on{background:#BEE3F8;border-color:#63B3ED}
.ro{flex:1;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;cursor:pointer;border:2px solid #E2E8F0;font-weight:700;background:#fff;font-family:inherit;font-size:13px}
.ro input{width:auto;margin:0}
.ok{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:10px 14px;border-radius:8px;font-weight:600;margin-bottom:14px;font-size:13px}
.sw{position:relative}
.sd{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #CBD5E0;border-radius:6px;max-height:240px;overflow-y:auto;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.15);display:none}
.si{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #F0F0F0;line-height:1.4}
.si:hover{background:#EBF4FB}
.lw{max-width:700px;margin:0 auto;background:#fff;border:1px solid #CBD5E0;border-radius:8px;overflow:hidden;font-size:11px}
.lh{background:#1A3A5C;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.lb{padding:10px 16px}
.lk{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;background:#EBF4FB;border-radius:6px;padding:10px;margin-bottom:10px}
.kl{font-size:9px;color:#718096;font-weight:700;text-transform:uppercase}.kv{font-size:13px;font-weight:700}
.sh{font-weight:700;font-size:10px;color:#1A3A5C;border-bottom:1.5px solid #1A3A5C;padding-bottom:4px;margin:10px 0 6px;text-transform:uppercase}
.lt{width:100%;border-collapse:collapse;margin-bottom:10px}
.lt td{padding:3px 8px;font-size:10px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.lt .th{background:#FAFAFA;font-weight:600;color:#4A5568;width:30%}
.lt thead th{background:#EBF4FB;padding:4px 8px;font-size:10px;font-weight:700;color:#1A3A5C;text-align:left}
.la{background:#EBF4FB;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:10px}
.lr{border-radius:8px;padding:10px 16px;text-align:center;margin-bottom:8px}
.lf{display:flex;justify-content:space-between;font-size:9px;color:#A0AEC0}
.ec{border:2.5px solid #1A3A5C;border-radius:6px;padding:7px 9px;background:#fff;font-size:10px}
.eh{color:#fff;text-align:center;font-weight:700;font-size:12px;padding:3px 0;border-radius:4px;margin-bottom:5px;letter-spacing:1px}
.en{font-weight:700;font-size:11px;text-align:center;border-bottom:1px solid #E2E8F0;padding-bottom:4px;margin-bottom:5px;line-height:1.3}
.et{width:100%;border-collapse:collapse;font-size:10px}.et td{padding:1px 0;vertical-align:top}
.el{color:#718096;width:28%}.ev{font-weight:600}
.ea{border-top:1px solid #E2E8F0;padding-top:4px;margin-top:4px;font-size:9px}
.etg{border-top:1px solid #E2E8F0;padding-top:3px;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 6px;font-size:9px}
.hi{border:1px solid #E2E8F0;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff}
.hi:hover{background:#EBF4FB}.hb{display:flex;gap:6px;margin-left:10px;flex-shrink:0}
.esr{padding:8px 14px;border-bottom:1px solid #EEF2F7;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff}
.esr:hover,.esr.on{background:#EBF4FB}
.cb{width:18px;height:18px;border-radius:4px;border:2px solid #CBD5E0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.cb.on{background:#1A3A5C;border-color:#1A3A5C;color:#fff}
.ft{text-align:center;font-size:11px;color:#A0AEC0;margin-top:12px}
.err{background:#FFF5F5;color:#9B2C2C;padding:16px;border-radius:8px;font-family:monospace;font-size:12px;margin:20px;white-space:pre-wrap}
@media print{
  @page{size:A4 portrait;margin:8mm}
  .np{display:none!important}
  body{background:#fff}.hdr,.tabs{display:none!important}
  .app{padding:0;max-width:100%}.card{box-shadow:none;border-radius:0}.body{padding:4px}
  .lw{max-width:100%!important;font-size:9.5px!important}
  .lh{padding:7px 12px!important}.lb{padding:7px 12px!important}.lk{padding:7px!important}
  .lt td{padding:2px 6px!important;font-size:9px!important}
  .epg{display:grid!important;grid-template-columns:1fr 1fr!important;gap:4mm!important}
}
</style>

/* ── PAINT & EVENTS ── */
function paint(){
  document.getElementById('root').innerHTML='<div class="app">'+renderHdr()+renderTabs()+'<div class="card body" id="tb">'+renderTab()+'</div><div class="ft np">CQ Formula Animal · Dados salvos localmente</div></div>';
  bindAll();}
function repaint(){
  document.getElementById('tb').innerHTML=renderTab();
  bindAll();}
function bindAll(){
  /* search */
  var inp=document.getElementById('ss'),drop=document.getElementById('sd');
  if(inp&&drop){
    inp.oninput=function(){S.form.substancia=this.value;doSearch(this.value);};
    inp.onfocus=function(){doSearch(this.value);};
    document.addEventListener('click',function outsideClick(ev){
      if(inp&&drop&&!inp.contains(ev.target)&&!drop.contains(ev.target)){drop.style.display='none';}
    });}
  /* history search */
  var hq=document.getElementById('hq');if(hq){hq.oninput=function(){S.histQ=this.value;repaint();};}
  /* gerenciar search */
  var sq=document.getElementById('sq');if(sq){sq.oninput=function(){S.subQ=this.value;repaint();};}
  /* gerenciar new sub inputs */
  var nsFields={n:'ns-n',d:'ns-d',s:'ns-s',tm:'ns-tm',dn:'ns-dn',fn:'ns-fn',a:'ns-a'};
  Object.keys(nsFields).forEach(function(k){var el=document.getElementById(nsFields[k]);if(el){el.oninput=function(){S.newSub[k]=this.value;};}});
  /* etiqueta qty selectors */
  document.querySelectorAll('.eq-sel').forEach(function(sel){sel.onchange=function(){setEQ(this.dataset.eid,+this.value);};});
  /* etiq toggle buttons */
  document.querySelectorAll('.etog-btn').forEach(function(btn){btn.onclick=function(ev){ev.stopPropagation();togE(this.dataset.eid);};});
  /* remove sub buttons */
  document.querySelectorAll('.remSub-btn').forEach(function(btn){btn.onclick=function(){remSub(this.dataset.sc);};});
  /* file inputs */
  var ie=document.getElementById('imp-e');if(ie){ie.onchange=function(ev){impE(ev);};}
  var id=document.getElementById('imp-d');if(id){id.onchange=function(ev){impD(ev);};}
  /* central data-action dispatcher */
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.onclick=function(ev){
      var a=this.dataset.action,v=this.dataset.val,eid=this.dataset.eid;
      if(a==='tab'){collectForm();S.tab=v;repaint();}
      else if(a==='newEntry'){newEntry();}
      else if(a==='saveEntry'){saveEntry();}
      else if(a==='print'){window.print();}
      else if(a==='loadE'){loadE(eid);}
      else if(a==='vLaudo'){ev.stopPropagation();vLaudo(eid);}
      else if(a==='vEtiq'){ev.stopPropagation();vEtiq(eid);}
      else if(a==='delE'){ev.stopPropagation();delE(eid);}
      else if(a==='gerTab'){S.gerTab=v;repaint();}
      else if(a==='addSub'){addSub();}
      else if(a==='expDB'){expDB();}
      else if(a==='expE'){expE();}
      else if(a==='pickImpE'){document.getElementById('imp-e').click();}
      else if(a==='pickImpD'){document.getElementById('imp-d').click();}
    };
  });
  /* form field changes - update state without repaint */
  document.querySelectorAll('[data-f]').forEach(function(el){
    el.oninput=function(){var f=this.dataset.f;S.form[f]=this.type==='checkbox'?this.checked:this.value;};
    el.onchange=function(){var f=this.dataset.f;S.form[f]=this.type==='checkbox'?this.checked:this.value;};
  });}

/* ── SEARCH ── */
function doSearch(q){
  var drop=document.getElementById('sd');if(!drop)return;
  if(q.length<2){drop.style.display='none';return;}
  var res=fdb().filter(function(s){return s.n.toLowerCase().indexOf(q.toLowerCase())>=0;}).slice(0,12);
  if(!res.length){drop.style.display='none';return;}
  var html='';
  res.forEach(function(s){
    html+='<div class="si" data-c="'+e(s.c)+'" data-n="'+e(s.n)+'" data-d="'+e(s.d||'')+'" data-ss="'+e(s.s||'')+'" data-a="'+e(s.a||'')+'" data-tm="'+e(s.tm||'')+'" data-dn="'+e(s.dn||'')+'" data-tr="'+e(s.tr||'')+'" data-fn="'+e(s.fn||'')+'">';
    html+='<span style="font-weight:600">'+e(s.n)+'</span>'+(s.d?'<span style="color:#888;font-size:11px;margin-left:8px">DCB '+e(s.d)+'</span>':'')+(s.s?'<span style="color:#aaa;font-size:11px;margin-left:8px">CAS '+e(s.s)+'</span>':'');
    html+='</div>';
  });
  drop.innerHTML=html;drop.style.display='block';
  drop.querySelectorAll('.si').forEach(function(el){
    el.onclick=function(){
      var d=el.dataset;
      S.form.substancia=d.n;S.form.codigo=d.c;S.form.dcb=d.d||S.form.dcb;S.form.cas=d.ss||S.form.cas;
      S.form.armazenamento=d.a||S.form.armazenamento;S.form.temperatura=d.tm||S.form.temperatura;
      S.form.densidade=d.dn||S.form.densidade;S.form.densidade_ref=d.dn||S.form.densidade_ref;
      S.form.teor=d.tr||S.form.teor;S.form.teor_ref=d.tr||S.form.teor_ref;S.form.fator=d.fn||S.form.fator;
      drop.style.display='none';repaint();
    };
  });}

/* ── ACTIONS ── */
function collectForm(){
  document.querySelectorAll('[data-f]').forEach(function(el){var f=el.dataset.f;S.form[f]=el.type==='checkbox'?el.checked:el.value;});
  document.querySelectorAll('input[type=radio]:checked').forEach(function(el){S.form[el.name]=el.value;});}
function newEntry(){S.form=blank();S.current=null;S.tab='entrada';S.msg='';paint();}
function saveEntry(){
  collectForm();var re=S.form.re||nre();
  var entry=Object.assign({},S.form,{re:re,id:Date.now()});
  S.entries=[entry].concat(S.entries);sls('cq_entries',S.entries);
  S.current=entry;S.tab='laudo';S.msg='✅ Salvo!';paint();}
function loadE(id){var en=S.entries.filter(function(x){return String(x.id)===String(id);})[0];if(en){S.form=Object.assign({},en);S.current=en;S.tab='entrada';repaint();}}
function vLaudo(id){var en=S.entries.filter(function(x){return String(x.id)===String(id);})[0];if(en){S.current=en;S.tab='laudo';repaint();}}
function vEtiq(id){var en=S.entries.filter(function(x){return String(x.id)===String(id);})[0];if(en){S.esel={};S.esel[en.id]=1;S.tab='etiqueta';repaint();}}
function delE(id){if(!confirm('Excluir esta entrada?'))return;S.entries=S.entries.filter(function(x){return String(x.id)!==String(id);});sls('cq_entries',S.entries);if(S.current&&String(S.current.id)===String(id))S.current=null;repaint();}
function togE(id){
  var numC=Object.keys(S.esel).filter(function(k){return S.esel[k];}).length;
  var total=Object.keys(S.esel).reduce(function(a,k){return a+(S.esel[k]||0);},0);
  if(S.esel[id]){var ns=Object.assign({},S.esel);delete ns[id];S.esel=ns;}
  else{if(numC>=8){alert('Max 8 laudos diferentes.');return;}if(total>=8){alert('Max 8 etiquetas por folha.');return;}S.esel[id]=1;}
  repaint();}
function setEQ(id,qty){
  var other=Object.keys(S.esel).filter(function(k){return k!=id;}).reduce(function(a,k){return a+(S.esel[k]||0);},0);
  var mx=Math.min(qty,8-other);
  if(mx<1){var ns=Object.assign({},S.esel);delete ns[id];S.esel=ns;}else{S.esel[id]=mx;}
  repaint();}
function addSub(){
  if(!S.newSub.n.trim()){alert('Nome obrigatorio.');return;}
  S.udb=S.udb.concat([Object.assign({},S.newSub,{c:'U'+Date.now()})]);
  sls('cq_userdb',S.udb);S.newSub={n:'',d:'',s:'',a:'',tm:'',dn:'',tr:'',fn:''};
  S.msg='Substancia adicionada!';repaint();setTimeout(function(){S.msg='';},3000);}
function remSub(c){if(!confirm('Remover?'))return;S.udb=S.udb.filter(function(s){return s.c!==c;});sls('cq_userdb',S.udb);repaint();}
function impE(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev2){try{var data=JSON.parse(ev2.target.result);if(!Array.isArray(data))throw new Error('not array');var ex=new Set(S.entries.map(function(x){return x.id;}));var add=data.filter(function(x){return!ex.has(x.id);});S.entries=add.concat(S.entries);sls('cq_entries',S.entries);S.msg=add.length+' entradas importadas!';repaint();setTimeout(function(){S.msg='';},4000);}catch(err){alert('Arquivo invalido: '+err.message);}};r.readAsText(f);ev.target.value='';}
function impD(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev2){try{var data=JSON.parse(ev2.target.result);if(!Array.isArray(data))throw new Error('not array');var ec=new Set(DB.map(function(s){return s.c;}));var newO=data.filter(function(s){return s.n&&!ec.has(s.c);}).map(function(s){return Object.assign({},s,{c:'U'+s.c});});S.udb=S.udb.concat(newO);sls('cq_userdb',S.udb);S.msg=newO.length+' substancias importadas!';repaint();setTimeout(function(){S.msg='';},4000);}catch(err){alert('Arquivo invalido: '+err.message);}};r.readAsText(f);ev.target.value='';}
function expDB(){var b=new Blob([JSON.stringify(DB.concat(S.udb),null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='substancias_cq.json';a.click();}
function expE(){var b=new Blob([JSON.stringify(S.entries,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='historico_cq.json';a.click();}

/* ── INIT ── */
try{paint();}catch(err){document.getElementById('root').innerHTML='<div class="err">Erro: '+err.message+'\\n\\n'+err.stack+'</div>';}

</script>
