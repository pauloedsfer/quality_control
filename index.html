<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CQ Fórmula Animal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#EDF2F7;min-height:100vh}
a{color:inherit}
.app{max-width:900px;margin:0 auto;padding:16px 12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.hdr{background:linear-gradient(135deg,#1A3A5C,#2B6CB0);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.hdr-sub{font-size:11px;opacity:.65;margin-top:2px}
.tabs{display:flex;border-bottom:2px solid #E2E8F0;overflow-x:auto}
.tab-btn{flex:1;min-width:90px;padding:11px 8px;border:none;background:transparent;font-size:12px;color:#718096;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
.tab-btn.active{color:#1A3A5C;font-weight:700;border-bottom-color:#1A3A5C}
.body-card{padding:18px;margin-top:0;border-radius:0 0 12px 12px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1A3A5C;color:#fff}
.btn-ghost{background:#EBF4FB;border:1px solid #BEE3F8;color:#1A3A5C}
.btn-danger{background:#FFF5F5;border:1px solid #FEB2B2;color:#9B2C2C}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-warn{background:#FFFBEB;border:1px solid #F6E05E;color:#744210}
.sec{border-radius:8px;padding:12px 14px;margin-bottom:12px}
.sec-blue{background:#EBF4FB}
.sec-green{background:#F0FFF4}
.sec-yellow{background:#FFFFF0}
.sec-red{background:#FFF5F5}
.sec-gray{background:#F7FAFC}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.lbl{font-size:11px;font-weight:700;color:#4A5568;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.field{margin-bottom:10px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #CBD5E0;border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:#fff;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#2B6CB0;box-shadow:0 0 0 2px rgba(43,108,176,.15)}
textarea{resize:vertical;min-height:56px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.conf-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EEF2F7}
.conf-row:last-child{border-bottom:none}
.conf-lbl{flex:1;font-size:13px}
.radio-grp{display:flex;gap:10px}
.radio-grp label{display:flex;align-items:center;gap:3px;font-size:12px;cursor:pointer;white-space:nowrap;color:#4A5568}
.radio-grp input[type=radio]{width:auto;margin:0}
.teste-box{border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.teste-box .t-name{font-weight:700;font-size:12px;color:#2D3748;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid #CBD5E0;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.tag input[type=checkbox]{width:auto;margin:0}
.tag.on{background:#BEE3F8;border-color:#63B3ED}
.res-opt{flex:1;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;cursor:pointer;border:2px solid #E2E8F0;font-weight:700;background:#fff;font-family:inherit;font-size:13px}
.res-opt input[type=radio]{width:auto;margin:0}
.alert-ok{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:10px 14px;border-radius:8px;font-weight:600;margin-bottom:14px;font-size:13px}
.alert-info{background:#EBF4FB;border:1px solid #90CDF4;color:#2C5282;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
/* search */
.search-wrap{position:relative}
.search-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #CBD5E0;border-radius:6px;max-height:240px;overflow-y:auto;z-index:99;box-shadow:0 4px 20px rgba(0,0,0,.15);display:none}
.search-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #F0F0F0;line-height:1.4}
.search-item:hover{background:#EBF4FB}
.search-item .s-dcb{color:#888;font-size:11px;margin-left:8px}
/* laudo */
.laudo-wrap{max-width:700px;margin:0 auto;background:#fff;border:1px solid #CBD5E0;border-radius:8px;overflow:hidden;font-size:11px}
.laudo-hdr{background:#1A3A5C;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
.laudo-body{padding:10px 16px}
.laudo-kpi{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;background:#EBF4FB;border-radius:6px;padding:10px;margin-bottom:10px}
.kpi-lbl{font-size:9px;color:#718096;font-weight:700;text-transform:uppercase}
.kpi-val{font-size:13px;font-weight:700}
.sec-hdr{font-weight:700;font-size:10px;color:#1A3A5C;border-bottom:1.5px solid #1A3A5C;padding-bottom:4px;margin:10px 0 6px;text-transform:uppercase}
.laudo-tbl{width:100%;border-collapse:collapse;margin-bottom:10px}
.laudo-tbl td{padding:3px 8px;font-size:10px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.laudo-tbl .th{background:#FAFAFA;font-weight:600;color:#4A5568;width:30%}
.laudo-tbl thead th{background:#EBF4FB;padding:4px 8px;font-size:10px;font-weight:700;color:#1A3A5C;text-align:left}
.laudo-arm{background:#EBF4FB;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:10px}
.laudo-obs{background:#FFF8E1;border:1px solid #F6E05E;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:10px}
.laudo-result{border-radius:8px;padding:10px 16px;text-align:center;margin-bottom:8px}
.laudo-footer{display:flex;justify-content:space-between;font-size:9px;color:#A0AEC0}
/* etiquetas */
.etiq-card{border:2.5px solid #1A3A5C;border-radius:6px;padding:7px 9px;background:#fff;font-size:10px;break-inside:avoid;page-break-inside:avoid}
.etiq-hdr{color:#fff;text-align:center;font-weight:700;font-size:12px;padding:3px 0;border-radius:4px;margin-bottom:5px;letter-spacing:1px}
.etiq-name{font-weight:700;font-size:11px;text-align:center;border-bottom:1px solid #E2E8F0;padding-bottom:4px;margin-bottom:5px;line-height:1.3}
.etiq-tbl{width:100%;border-collapse:collapse;font-size:10px}
.etiq-tbl td{padding:1px 0;vertical-align:top}
.etiq-lbl{color:#718096;width:28%}
.etiq-val{font-weight:600}
.etiq-arm{border-top:1px solid #E2E8F0;padding-top:4px;margin-top:4px;font-size:9px}
.etiq-arm-lbl{font-size:9px;font-weight:700;color:#4A5568;text-transform:uppercase;margin-bottom:2px}
.etiq-tags{border-top:1px solid #E2E8F0;padding-top:3px;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 6px;font-size:9px}
.hist-item{border:1px solid #E2E8F0;border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:background .15s}
.hist-item:hover{background:#EBF4FB}
.hist-btns{display:flex;gap:6px;margin-left:10px;flex-shrink:0}
.footer{text-align:center;font-size:11px;color:#A0AEC0;margin-top:12px}
.etiq-sel-row{padding:8px 14px;border-bottom:1px solid #EEF2F7;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff;transition:background .15s}
.etiq-sel-row:hover{background:#F7FAFC}
.etiq-sel-row.sel{background:#EBF4FB}
.chk-box{width:18px;height:18px;border-radius:4px;border:2px solid #CBD5E0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px}
.chk-box.on{background:#1A3A5C;border-color:#1A3A5C}
/* print */
@media print{
  @page{size:A4 portrait;margin:8mm}
  .no-print{display:none!important}
  body{background:#fff}
  .hdr,.tabs{display:none!important}
  .app{padding:0;max-width:100%}
  .card{box-shadow:none;border-radius:0}
  .body-card{padding:4px}
  .laudo-wrap{max-width:100%!important;font-size:9.5px!important}
  .laudo-hdr{padding:7px 12px!important}
  .laudo-body{padding:7px 12px!important}
  .laudo-kpi{padding:7px!important}
  .kpi-val{font-size:12px!important}
  .laudo-tbl td{padding:2px 6px!important;font-size:9px!important}
  .sec-hdr{margin:6px 0 4px!important}
  /* etiq print: 2 col grid */
  .etiq-print-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:4mm!important}
}
</style>
</head>

function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fullDB(){ return [...EMBEDDED_DB,...S.userDB]; }

function confColor(v){ return v==='C'?'#276749':v==='N'?'#9B2C2C':'#718096'; }
function confLabel(v){ return v==='C'?'Conforme (✓)':v==='N'?'Não Conforme (✗)':'N/R'; }
function tag(v,lbl){ return `<label class="tag${S.form[v]?' on':''}" style="cursor:pointer"><input type="checkbox" name="${v}" ${S.form[v]?'checked':''} style="width:auto;margin:0"> ${esc(lbl)}</label>`; }
function radio(name,val,label,checked,color){ return `<label class="res-opt" style="border-color:${checked?resBorder(val):'#E2E8F0'};background:${checked?resBg(val):'#fff'}"><input type="radio" name="${name}" value="${val}" ${checked?'checked':''} style="width:auto;margin:0"> <span style="color:${resColor(val)};font-size:13px">${label}</span></label>`; }
function confRow(label,val,name){ return `<div class="conf-row"><span class="conf-lbl">${esc(label)}</span><div class="radio-grp"><label><input type="radio" name="${name}" value="C" ${val==='C'?'checked':''}> ✅ Conforme</label><label><input type="radio" name="${name}" value="N" ${val==='N'?'checked':''}> ❌ Não Conf.</label><label><input type="radio" name="${name}" value="NR" ${val==='NR'?'checked':''}> N/R</label></div></div>`; }
function field(label, fld, type='text', opts){ const v=S.form[fld]??''; if(opts){ const optHtml=opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join(''); return `<div class="field"><label class="lbl">${label}</label><select data-f="${fld}"><option value="">— selecione —</option>${optHtml}</select></div>`; } return `<div class="field"><label class="lbl">${label}</label><input type="${type}" data-f="${fld}" value="${esc(v)}"></div>`; }

function etiqCard(e){
  const RE=esc(e.re)+'/'+esc(e.ano);
  const TAGS=[['port344','Port.344'],['termossens','Termoss.'],['fotossens','Fotoss.'],['higro','Higro.'],['hormonio','Horm.'],['citostatico','Cito.'],['antibiotico','Antib.']];
  const fatorOk=e.fator&&e.fator!='1'&&e.fator!='';
  return `<div class="etiq-card" style="border-color:${e.resultado==='Q'?'#D69E2E':'#1A3A5C'}">
    <div class="etiq-hdr" style="background:${resColor(e.resultado)}">${resLabel(e.resultado)}</div>
    <div class="etiq-name">${esc(e.substancia)}</div>
    <table class="etiq-tbl"><tbody>
      <tr><td class="etiq-lbl">DT.Fabr.:</td><td class="etiq-val">${esc(e.fabricacao)}</td><td class="etiq-lbl" style="width:12%">RE</td><td style="font-weight:700;color:#1A3A5C">${RE}</td></tr>
      <tr><td class="etiq-lbl">DT.Valid.:</td><td style="font-weight:700;font-size:12px;color:#9B2C2C">${esc(e.validade)||'—'}</td><td class="etiq-lbl">DCB:</td><td class="etiq-val">${esc(e.dcb)||'n/d'}</td></tr>
      ${fatorOk?`<tr><td class="etiq-lbl">F.Corr.:</td><td colspan="3" style="font-weight:700;font-size:13px;color:#9B2C2C">${esc(e.fator)}</td></tr>`:
                `<tr><td class="etiq-lbl">F.Corr.:</td><td class="etiq-val">${esc(e.fator)||'—'}</td><td class="etiq-lbl">Orig.:</td><td class="etiq-val">${esc(e.origem)||'—'}</td></tr>`}
      <tr><td class="etiq-lbl">Fornec.:</td><td colspan="2" class="etiq-val">${esc(e.fornecedor)}</td><td></td></tr>
      <tr><td class="etiq-lbl">Lote:</td><td class="etiq-val">${esc(e.lote)}</td><td class="etiq-lbl">Dens.:</td><td class="etiq-val">${esc(e.densidade)||'—'}</td></tr>
      <tr><td class="etiq-lbl">Qtde.:</td><td class="etiq-val">${esc(e.qtde)}</td><td class="etiq-lbl">Teor:</td><td class="etiq-val">${esc(e.teor_fab||e.teor)||'—'}</td></tr>
      <tr><td class="etiq-lbl">CAS:</td><td colspan="3" style="font-weight:600;font-size:9px">${esc(e.cas)||'—'}</td></tr>
    </tbody></table>
    ${e.armazenamento?`<div class="etiq-arm"><div class="etiq-arm-lbl">Armazenamento</div><div style="font-size:9px;color:#2D3748;line-height:1.4">${esc((e.armazenamento||'').substring(0,80))}${(e.armazenamento||'').length>80?'…':''}</div></div>`:''}
    <div class="etiq-tags">${TAGS.map(([k,l])=>`<span style="color:${e[k]?'#1A3A5C':'#CBD5E0'};font-weight:${e[k]?700:400}">${e[k]?'☑':'☐'} ${l}</span>`).join('')}</div>
  </div>`;
}

function paint(){
  document.getElementById('root').innerHTML=`<div class="app">${renderHeader()}${renderTabs()}<div class="card body-card" id="tab-body">${renderTab()}</div><div class="footer no-print">CQ Fórmula Animal · Dados salvos localmente neste navegador</div></div>`;
  bindSearch();
}

function repaintTab(){
  document.getElementById('tab-body').innerHTML=renderTab();
  if(S.tab==='entrada') bindSearch();
}

function bindSearch(){
  const inp=document.getElementById('sub-search');
  const drop=document.getElementById('search-drop');
  if(!inp||!drop) return;
  inp.oninput=function(){ doSearch(this.value); S.form.substancia=this.value; };
  inp.onfocus=function(){ doSearch(this.value); };
  document.addEventListener('click',function(e){ if(!inp.contains(e.target)&&!drop.contains(e.target)) drop.style.display='none'; },{once:false});
  // re-attach on every paint
}
let _docClick=null;
function doSearch(q){
  const drop=document.getElementById('search-drop');
  if(!drop) return;
  if(q.length<2){ drop.style.display='none'; return; }
  const res=fullDB().filter(s=>s.n.toLowerCase().includes(q.toLowerCase())).slice(0,12);
  if(res.length===0){ drop.style.display='none'; return; }
  drop.innerHTML=res.map(s=>`<div class="search-item" data-sid="${esc(s.c)}" data-sn="${esc(s.n)}" data-sd="${esc(s.d||'')}" data-ss="${esc(s.s||'')}" data-sa="${esc(s.a||'')}" data-stm="${esc(s.tm||'')}" data-sdn="${esc(s.dn||'')}" data-str="${esc(s.tr||'')}" data-sfn="${esc(s.fn||'')}">
    <span style="font-weight:600">${esc(s.n)}</span>
    ${s.d?`<span class="s-dcb">DCB ${esc(s.d)}</span>`:''}
    ${s.s?`<span class="s-dcb">CAS ${esc(s.s)}</span>`:''}
  </div>`).join('');
  drop.style.display='block';
  drop.querySelectorAll('.search-item').forEach(el=>{
    el.onclick=function(){
      const d=this.dataset;
      S.form.substancia=d.sn; S.form.codigo=d.sid;
      S.form.dcb=d.sd||S.form.dcb;
      S.form.cas=d.ss||S.form.cas;
      S.form.armazenamento=d.sa||S.form.armazenamento;
      S.form.temperatura=d.stm||S.form.temperatura;
      S.form.densidade=d.sdn||S.form.densidade;
      S.form.densidade_ref=d.sdn||S.form.densidade_ref;
      S.form.teor=d.str||S.form.teor;
      S.form.teor_ref=d.str||S.form.teor_ref;
      S.form.fator=d.sfn||S.form.fator;
      document.getElementById('sub-search').value=d.sn;
      drop.style.display='none';
      repaintTab();
    };
  });
}

// ── ACTIONS ──────────────────────────────────────────────────────────
function collectForm(){
  // read all data-f inputs
  document.querySelectorAll('[data-f]').forEach(el=>{
    const f=el.dataset.f;
    if(el.type==='checkbox') S.form[f]=el.checked;
    else S.form[f]=el.value;
  });
  // radio buttons
  document.querySelectorAll('input[type=radio]:checked').forEach(el=>{ S.form[el.name]=el.value; });
}

function switchTab(t){ collectForm(); S.tab=t; repaintTab(); if(t==='entrada') bindSearch(); }
function newEntry(){ S.form=blank(); S.current=null; S.tab='entrada'; S.msg=''; repaintTab(); bindSearch(); }

function saveEntry(){
  collectForm();
  const re=S.form.re||nextRE();
  const entry={...S.form, re, id:Date.now()};
  S.entries=[entry,...S.entries];
  LS.set('cq_entries',S.entries);
  S.current=entry;
  S.tab='laudo';
  S.msg='✅ Salvo! Laudo e etiqueta disponíveis nas abas ao lado.';
  paint();
}

function loadEntry(id){
  const e=S.entries.find(x=>String(x.id)===String(id));
  if(e){ S.form={...e}; S.current=e; S.tab='entrada'; repaintTab(); bindSearch(); }
}

function viewLaudo(id){
  const e=S.entries.find(x=>String(x.id)===String(id));
  if(e){ S.current=e; S.tab='laudo'; repaintTab(); }
}

function viewEtiq(id){
  const e=S.entries.find(x=>String(x.id)===String(id));
  if(e){ S.etiqSel={[e.id]:1}; S.tab='etiqueta'; repaintTab(); }
}

function deleteEntry(id){
  if(!confirm('Excluir esta entrada do histórico?')) return;
  S.entries=S.entries.filter(e=>String(e.id)!==String(id));
  LS.set('cq_entries',S.entries);
  if(S.current&&String(S.current.id)===String(id)) S.current=null;
  repaintTab();
}

function toggleEtiq(id){
  const numCodes=Object.keys(S.etiqSel).length;
  const total=Object.values(S.etiqSel).reduce((a,b)=>a+b,0);
  if(S.etiqSel[id]){ const n={...S.etiqSel}; delete n[id]; S.etiqSel=n; }
  else {
    if(numCodes>=8){ alert('Máximo de 8 laudos diferentes por impressão.'); return; }
    if(total>=8){ alert('Máximo de 8 etiquetas por folha.'); return; }
    S.etiqSel={...S.etiqSel,[id]:1};
  }
  repaintTab();
}

function setEtiqQty(id,qty){
  const other=Object.entries(S.etiqSel).filter(([k])=>k!=id).reduce((a,[,v])=>a+v,0);
  const max=Math.min(qty,8-other);
  if(max<1){ const n={...S.etiqSel}; delete n[id]; S.etiqSel=n; }
  else S.etiqSel={...S.etiqSel,[id]:max};
  repaintTab();
}

function addSub(){
  if(!S.newSub.n.trim()){ alert('Nome obrigatório.'); return; }
  const item={...S.newSub, c:'U'+Date.now()};
  S.userDB=[...S.userDB,item];
  LS.set('cq_userdb',S.userDB);
  S.newSub={n:'',d:'',s:'',a:'',tm:'',dn:'',tr:'',fn:''};
  S.msg='Substância adicionada com sucesso!';
  repaintTab();
  setTimeout(()=>{ S.msg=''; },3000);
}

function removeSub(c){
  if(!confirm('Remover esta substância?')) return;
  S.userDB=S.userDB.filter(s=>s.c!==c);
  LS.set('cq_userdb',S.userDB);
  repaintTab();
}

function importEntries(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw 0;
      const existing=new Set(S.entries.map(x=>x.id));
      const toAdd=data.filter(x=>!existing.has(x.id));
      S.entries=[...toAdd,...S.entries];
      LS.set('cq_entries',S.entries);
      S.msg=`${toAdd.length} entradas importadas com sucesso!`;
      repaintTab();
      setTimeout(()=>{ S.msg=''; },4000);
    } catch { alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
  ev.target.value='';
}

function importSubDB(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw 0;
      const embCodes=new Set(EMBEDDED_DB.map(s=>s.c));
      const newOnes=data.filter(s=>s.n&&!embCodes.has(s.c)).map(s=>({...s,c:'U'+s.c}));
      S.userDB=[...S.userDB,...newOnes];
      LS.set('cq_userdb',S.userDB);
      S.msg=`${newOnes.length} novas substâncias importadas!`;
      repaintTab();
      setTimeout(()=>{ S.msg=''; },4000);
    } catch { alert('Arquivo inválido.'); }
  };
  r.readAsText(f);
  ev.target.value='';
}

function exportDB(){
  const all=[...EMBEDDED_DB,...S.userDB];
  const b=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='substancias_cq.json'; a.click();
}

function exportEntries(){
  const b=new Blob([JSON.stringify(S.entries,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='historico_cq.json'; a.click();
}

// ── INIT ─────────────────────────────────────────────────────────────
paint();
</script>
</body>
