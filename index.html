function loadEntries() {
  try { return JSON.parse(localStorage.getItem('cq_entries') || '[]'); } catch { return []; }
}
function saveEntries(list) {
  try { localStorage.setItem('cq_entries', JSON.stringify(list)); } catch {}
}

function Search({value, onChange, onSelect}) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState(value);
  const ref = useRef();
  const results = q.length >= 2 ? DB.filter(s => s.n.toLowerCase().includes(q.toLowerCase())).slice(0,10) : [];
  useEffect(() => { setQ(value); }, [value]);
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
  return (
    <div ref={ref} style={{position:'relative'}}>
      <input value={q} placeholder="Digite o nome da substância..."
        onChange={e => { setQ(e.target.value); onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)} />
      {open && results.length > 0 && (
        <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:999,background:'#fff',border:'1px solid #c8d6e5',borderRadius:6,maxHeight:240,overflowY:'auto',boxShadow:'0 4px 16px rgba(0,0,0,.15)'}}>
          {results.map(s => (
            <div key={s.c+s.n} onClick={() => { onSelect(s); setQ(s.n); setOpen(false); }}
              style={{padding:'8px 12px',cursor:'pointer',fontSize:13,borderBottom:'1px solid #f0f0f0',lineHeight:1.4}}
              onMouseEnter={e=>e.currentTarget.style.background='#EBF4FB'}
              onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
              <span style={{fontWeight:600}}>{s.n}</span>
              {s.d && <span style={{color:'#888',fontSize:11,marginLeft:8}}>DCB {s.d}</span>}
              {s.s && <span style={{color:'#aaa',fontSize:11,marginLeft:8}}>CAS {s.s}</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Field({label, value, onChange, type='text', options, note}) {
  return (
    <div style={{marginBottom:12}}>
      <label style={{fontSize:11,fontWeight:700,color:'#4A5568',textTransform:'uppercase',letterSpacing:.5,display:'block',marginBottom:4}}>{label}</label>
      {options ? (
        <select value={value} onChange={e=>onChange(e.target.value)}>
          <option value="">— selecione —</option>
          {options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      ) : (
        <input type={type} value={value} onChange={e=>onChange(e.target.value)} />
      )}

function App() {
  const [tab, setTab] = useState('entrada');
  const [form, setForm] = useState(blank());
  const [entries, setEntries] = useState(() => loadEntries());
  const [saved, setSaved] = useState(false);
  const [current, setCurrent] = useState(null);
  const [search, setSearch] = useState('');

  const f = key => val => setForm(p => ({...p, [key]: val}));

  const handleSelect = spec => {
    setForm(p => ({
      ...p,
      substancia: spec.n, codigo: spec.c,
      dcb: spec.d || p.dcb, cas: spec.s || p.cas,
      armazenamento: spec.a || p.armazenamento,
      temperatura: spec.tm || p.temperatura,
      densidade: spec.dn || p.densidade,
      teor: spec.tr || p.teor,
      fator: spec.fn || p.fator,
    }));
  };

  const nextRE = () => {
    const yr = new Date().getFullYear().toString().slice(-2);
    return String(entries.filter(e => e.ano === yr).length + 1).padStart(3,'0');
  };

  const handleSave = () => {
    const re = form.re || nextRE();
    const entry = {...form, re, id: Date.now()};
    const updated = [entry, ...entries];
    setEntries(updated);
    saveEntries(updated);
    setCurrent(entry);
    setSaved(true);
    setTimeout(() => setSaved(false), 3000);
    setTab('laudo');
  };

  const handleDelete = id => {
    if (!confirm('Excluir esta entrada?')) return;
    const updated = entries.filter(e => e.id !== id);
    setEntries(updated);
    saveEntries(updated);
    if (current && current.id === id) setCurrent(null);
  };

  const handlePrint = () => window.print();

  const filtered = search
    ? entries.filter(e => e.substancia?.toLowerCase().includes(search.toLowerCase()) ||
                          e.fornecedor?.toLowerCase().includes(search.toLowerCase()) ||
                          e.lote?.toLowerCase().includes(search.toLowerCase()))
    : entries;

  const g2 = {display:'grid', gridTemplateColumns:'1fr 1fr', gap:12};

  return (
    <div style={{maxWidth:860,margin:'0 auto',padding:'20px 16px'}}>

                {[['port344','Port. 344'],['termossens','Termossensível'],['fotossens','Fotossensível'],
                  ['higro','Higroscópico'],['hormonio','Hormônio'],['citostatico','Citostático'],['antibiotico','Antibiótico']].map(([k,l])=>(
                  <label key={k} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,cursor:'pointer',padding:'6px 10px',background:form[k]?'#BEE3F8':'#fff',borderRadius:6,border:'1px solid #CBD5E0',transition:'background .15s'}}>
                    <input type="checkbox" checked={!!form[k]} onChange={e=>f(k)(e.target.checked)} style={{width:'auto',margin:0}} />{l}
                  </label>
                ))}
              </div>
            </div>

            <div style={{background:'#F7FAFC',borderRadius:8,padding:'12px 16px',marginBottom:20}}>
              <div style={{fontSize:12,fontWeight:700,color:'#4A5568',marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>Resultado Final</div>
              <div style={{display:'flex',gap:12,marginBottom:12}}>
                {[['A','✅ Aprovado','#276749','#F0FFF4','#C6F6D5'],['R','❌ Reprovado','#9B2C2C','#FFF5F5','#FED7D7']].map(([v,l,c,bg,bdr])=>(
                  <label key={v} style={{flex:1,display:'flex',alignItems:'center',gap:8,padding:'10px 16px',borderRadius:8,cursor:'pointer',border:`2px solid ${form.resultado===v?c:bdr}`,background:form.resultado===v?bg:'#fff',transition:'all .15s'}}>
                    <input type="radio" value={v} checked={form.resultado===v} onChange={()=>f('resultado')(v)} style={{width:'auto',margin:0}} />
                    <span style={{color:c,fontSize:14,fontWeight:700}}>{l}</span>
                  </label>
                ))}
              </div>
              <div style={g2}>
                <Field label="Analisado por" value={form.analisado} onChange={f('analisado')} />
                <Field label="Observações" value={form.obs} onChange={f('obs')} />
              </div>
            </div>

            <button onClick={handleSave}
              style={{width:'100%',padding:'15px',background:'#1A3A5C',color:'#fff',border:'none',borderRadius:8,fontSize:15,fontWeight:700,letterSpacing:.3}}>
              💾 Salvar Entrada → Gerar Laudo e Etiqueta
            </button>
          </div>
        )}

        {tab==='laudo' && <Laudo e={current} onPrint={handlePrint} />}
        {tab==='etiqueta' && <Etiqueta e={current} onPrint={handlePrint} />}

        {/* ── HISTÓRICO ── */}
        {tab==='historico' && (
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div style={{fontSize:15,fontWeight:700,color:'#1A3A5C'}}>{entries.length} entrada{entries.length!==1?'s':''} salva{entries.length!==1?'s':''}</div>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar por produto, lote..." style={{width:240}} />
            </div>
            {entries.length===0 && (
              <div style={{textAlign:'center',padding:60,color:'#A0AEC0',border:'2px dashed #E2E8F0',borderRadius:12}}>
                <div style={{fontSize:40,marginBottom:12}}>📋</div>
                <div style={{fontSize:15}}>Nenhuma entrada registrada.</div>
                <button onClick={()=>setTab('entrada')} style={{marginTop:16,padding:'10px 24px',background:'#1A3A5C',color:'#fff',border:'none',borderRadius:6,fontSize:14,fontWeight:600}}>
                  + Criar primeira entrada
                </button>
              </div>
            )}
            {filtered.map(e => (
              <div key={e.id}
                style={{border:'1px solid #E2E8F0',borderRadius:10,padding:'12px 16px',marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',transition:'background .15s',background:'#fff'}}
                onMouseEnter={el=>el.currentTarget.style.background='#EBF4FB'}
                onMouseLeave={el=>el.currentTarget.style.background='#fff'}
                onClick={()=>{setCurrent(e);setForm(e);setTab('entrada');}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:'#1A3A5C'}}>RE {e.re}/{e.ano} — {e.substancia}</div>
                  <div style={{fontSize:12,color:'#718096',marginTop:3}}>
                    {e.fornecedor} · Lote {e.lote} · Val. {e.validade||'—'} ·{' '}
                    <span style={{color:e.resultado==='A'?'#276749':'#9B2C2C',fontWeight:600}}>{e.resultado==='A'?'APROVADO':'REPROVADO'}</span>
                  </div>
                </div>
                <div style={{display:'flex',gap:6}}>
                  <button onClick={ev=>{ev.stopPropagation();setCurrent(e);setTab('laudo');}}
                    style={{padding:'5px 12px',background:'#EBF4FB',border:'1px solid #BEE3F8',borderRadius:5,fontSize:12,color:'#1A3A5C',fontWeight:600}}>Laudo</button>
                  <button onClick={ev=>{ev.stopPropagation();setCurrent(e);setTab('etiqueta');}}
                    style={{padding:'5px 12px',background:'#EBF4FB',border:'1px solid #BEE3F8',borderRadius:5,fontSize:12,color:'#1A3A5C',fontWeight:600}}>Etiqueta</button>
                  <button onClick={ev=>{ev.stopPropagation();handleDelete(e.id);}}
                    style={{padding:'5px 12px',background:'#FFF5F5',border:'1px solid #FEB2B2',borderRadius:5,fontSize:12,color:'#9B2C2C',fontWeight:600}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{textAlign:'center',fontSize:11,color:'#A0AEC0',marginTop:16}} className="no-print">
        CQ Fórmula Animal · Os dados ficam salvos neste navegador
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
