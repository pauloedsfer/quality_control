<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CQ Fórmula Animal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#EDF2F7;min-height:100vh;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid #CBD5E0;border-radius:6px;background:#fff;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:#2B6CB0;box-shadow:0 0 0 2px rgba(43,108,176,.15)}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer}
.btn{padding:8px 16px;border:none;border-radius:6px;font-weight:600;font-size:13px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-primary{background:#1A3A5C;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:#EBF4FB;border:1px solid #BEE3F8;color:#1A3A5C}
.btn-danger{background:#FFF5F5;border:1px solid #FEB2B2;color:#9B2C2C}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden}
.section{border-radius:8px;padding:12px 14px;margin-bottom:12px}
.sec-blue{background:#EBF4FB}
.sec-green{background:#F0FFF4}
.sec-yellow{background:#FFFFF0}
.sec-red{background:#FFF5F5}
.sec-gray{background:#F7FAFC}
.sec-orange{background:#FFFAF0}
.label{font-size:11px;font-weight:700;color:#4A5568;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid #CBD5E0;font-size:12px;cursor:pointer;background:#fff;transition:background .15s;user-select:none}
.tag-on{background:#BEE3F8;border-color:#63B3ED}
.alert-success{background:#F0FFF4;border:1px solid #68D391;color:#276749;padding:10px 14px;border-radius:8px;font-weight:600;margin-bottom:14px}
.alert-info{background:#EBF4FB;border:1px solid #90CDF4;color:#2C5282;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.conf-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #EEF2F7}
.conf-row:last-child{border-bottom:none}
.conf-label{flex:1;font-size:13px}
.radio-group{display:flex;gap:8px}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;white-space:nowrap;color:#4A5568}
.radio-group input{width:auto;margin:0}

/* ── LAUDO PRINT ── */
@media print{
  @page{size:A4 portrait;margin:8mm}
  .no-print{display:none!important}
  body{background:#fff;font-size:9.5px}
  .card{box-shadow:none;border-radius:0}
  .laudo-wrap{max-width:100%!important;margin:0!important}
  .laudo-hdr{padding:8px 14px!important}
  .laudo-hdr .title{font-size:12px!important}
  .laudo-body{padding:8px 12px!important}
  .laudo-kpi{padding:8px!important}
  .laudo-kpi .kpi-val{font-size:14px!important}
  table td{padding:2px 6px!important;font-size:9px!important}
  .laudo-result{padding:8px 14px!important}
  .laudo-result .res-val{font-size:14px!important}
  .laudo-arm{padding:6px 10px!important;font-size:9px!important}
  .sec-title{font-size:9px!important;margin-bottom:4px!important}
  .testes-grid{grid-template-columns:1fr 1fr!important}

  /* ETIQUETA PRINT */
  .etiq-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:4mm!important;padding:0!important}
  .etiq-card{width:auto!important;page-break-inside:avoid!important}
  .etiq-page{page-break-after:always}
  .etiq-page:last-child{page-break-after:auto}
}
</style>
</head>

/* ── HELPERS ── */
function confLabel(v){return v==='C'?'Conforme (✓)':v==='N'?'Não Conforme (✗)':'N/R'}
function confColor(v){return v==='C'?'#276749':v==='N'?'#9B2C2C':'#718096'}
function resColor(r){return r==='A'?'#276749':r==='Q'?'#744210':'#9B2C2C'}
function resBg(r){return r==='A'?'#F0FFF4':r==='Q'?'#FFFBEB':'#FFF5F5'}
function resText(r){return r==='A'?'✅ APROVADO':r==='Q'?'🟡 QUARENTENA':'❌ REPROVADO'}
function resBorder(r){return r==='A'?'#38A169':r==='Q'?'#D69E2E':'#E53E3E'}

/* ── SEARCH COMPONENT ── */
function Search({value,onChange,onSelect,db}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState(value);
  const ref=useRef();
  const results=q.length>=2?db.filter(s=>s.n.toLowerCase().includes(q.toLowerCase())).slice(0,12):[];
  useEffect(()=>{setQ(value)},[value]);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);
  return(
    <div ref={ref} style={{position:'relative'}}>
      <input value={q} placeholder="Digite o nome da substância..."
        onChange={e=>{setQ(e.target.value);onChange(e.target.value);setOpen(true)}}
        onFocus={()=>setOpen(true)} />
      {open&&results.length>0&&(
        <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:999,background:'#fff',border:'1px solid #CBD5E0',borderRadius:6,maxHeight:250,overflowY:'auto',boxShadow:'0 4px 20px rgba(0,0,0,.15)'}}>
          {results.map(s=>(
            <div key={s.c+s.n} onClick={()=>{onSelect(s);setQ(s.n);setOpen(false)}}
              style={{padding:'8px 12px',cursor:'pointer',borderBottom:'1px solid #F0F0F0',lineHeight:1.4}}
              onMouseEnter={e=>e.currentTarget.style.background='#EBF4FB'}
              onMouseLeave={e=>e.currentTarget.style.background='#fff'}>
              <span style={{fontWeight:600,fontSize:13}}>{s.n}</span>
              {s.d&&<span style={{color:'#888',fontSize:11,marginLeft:8}}>DCB {s.d}</span>}
              {s.s&&<span style={{color:'#aaa',fontSize:11,marginLeft:8}}>CAS {s.s}</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── FIELD COMPONENT ── */
function Field({label,value,onChange,type='text',options,note,small}){
  return(
    <div style={{marginBottom:small?6:10}}>
      {label&&<label className="label">{label}</label>}
      {options?(
        <select value={value} onChange={e=>onChange(e.target.value)}>
          <option value="">— selecione —</option>
          {options.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      ):(
        <input type={type} value={value} onChange={e=>onChange(e.target.value)} />
      )}
      {note&&<div style={{fontSize:10,color:'#A0AEC0',marginTop:3}}>{note}</div>}
    </div>
  );
}

/* ── CONF ROW ── */
function Conf({label,value,onChange}){
  return(
    <div className="conf-row">
      <span className="conf-label">{label}</span>
      <div className="radio-group">
        {[['C','✅ Conforme'],['N','❌ Não Conf.'],['NR','N/R']].map(([v,l])=>(
          <label key={v}><input type="radio" name={label} value={v} checked={value===v} onChange={()=>onChange(v)} />{l}</label>
        ))}
      </div>
    </div>
  );
}

/* ── TESTE ROW ── */
function TesteRow({label,refVal,onRefChange,resultVal,onResultChange,confVal,onConfChange}){
  return(
    <div style={{border:'1px solid #E2E8F0',borderRadius:8,padding:'10px 12px',marginBottom:8}}>
      <div style={{fontWeight:700,fontSize:12,color:'#2D3748',marginBottom:8}}>{label}</div>
      <div className="grid2" style={{gap:8,marginBottom:8}}>
        <div>
          <label className="label">Referência / Especificação</label>
          <input value={refVal} onChange={e=>onRefChange(e.target.value)} placeholder="Ex: Pó branco a amarelado" />
        </div>
        <div>
          <label className="label">Resultado Obtido</label>
          <input value={resultVal} onChange={e=>onResultChange(e.target.value)} placeholder="Resultado do analista" />
        </div>
      </div>
      <div className="radio-group">
        <span style={{fontSize:12,color:'#4A5568',marginRight:6}}>Resultado:</span>
        {[['C','✅ Conforme'],['N','❌ Não Conforme'],['NR','— N/R']].map(([v,l])=>(
          <label key={v}><input type="radio" name={label+'_conf'} value={v} checked={confVal===v} onChange={()=>onConfChange(v)} />{l}</label>
        ))}
      </div>
    </div>
  );
}

          {/* Resultado */}
          <div className="laudo-result" style={{background:resBg(e.resultado),border:`2px solid ${resBorder(e.resultado)}`,borderRadius:8,padding:'10px 16px',textAlign:'center',marginBottom:8}}>

          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════ ETIQUETAS COMPONENT ══════════════════ */
function Etiquetas({entries}){
  const [selections,setSelections]=useState({}); // {id: qty}
  const [search,setSearch]=useState('');

  const totalEtiq=Object.values(selections).reduce((a,b)=>a+b,0);
  const numCodes=Object.keys(selections).length;

  const filtered=search
    ?entries.filter(e=>e.substancia?.toLowerCase().includes(search.toLowerCase())||e.re?.includes(search))
    :entries.slice(0,50);

  function toggleEntry(e){
    setSelections(s=>{
      if(s[e.id]) { const n={...s}; delete n[e.id]; return n; }
      if(numCodes>=8) { alert('Máximo de 8 laudos diferentes por impressão.'); return s; }
      if(totalEtiq>=8) { alert('Máximo de 8 etiquetas por folha.'); return s; }
      return {...s,[e.id]:1};
    });
  }
  function setQty(id,qty){
    setSelections(s=>{
      const other=Object.entries(s).filter(([k])=>k!=id).reduce((a,[,v])=>a+v,0);
      const maxQty=Math.min(qty,8-other);
      if(maxQty<1){const n={...s};delete n[id];return n;}
      return {...s,[id]:maxQty};
    });
  }

  // Build etiqueta list
  const etiqList=[];
  const selectedEntries=entries.filter(e=>selections[e.id]);
  selectedEntries.forEach(e=>{
    const qty=selections[e.id]||0;
    for(let i=0;i<qty;i++) etiqList.push(e);
  });

  const EtiqCard=({e})=>{
    const RE=e.re+'/'+e.ano;
    const check=v=>v?'☑':'☐';
    const fatorDiff=e.fator&&e.fator!='1'&&e.fator!='';
    return(
      <div className="etiq-card" style={{border:`2.5px solid ${e.resultado==='Q'?'#D69E2E':'#1A3A5C'}`,borderRadius:6,padding:'7px 9px',background:'#fff',fontFamily:'Arial,sans-serif',fontSize:10,breakInside:'avoid',pageBreakInside:'avoid'}}>
        <div style={{background:resColor(e.resultado),color:'#fff',textAlign:'center',fontWeight:700,fontSize:12,padding:'3px 0',borderRadius:4,marginBottom:6,letterSpacing:1}}>
          {resText(e.resultado)}
        </div>
        <div style={{fontWeight:700,fontSize:11,textAlign:'center',marginBottom:5,borderBottom:'1px solid #E2E8F0',paddingBottom:4,lineHeight:1.3}}>{e.substancia}</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:10}}>
          <tbody>
            <tr>
              <td style={{color:'#718096',width:'28%',paddingBottom:2}}>DT.Fabr.:</td>
              <td style={{fontWeight:600,paddingBottom:2}}>{e.fabricacao}</td>
              <td style={{color:'#718096',width:'12%'}}>RE</td>
              <td style={{fontWeight:700,color:'#1A3A5C'}}>{RE}</td>
            </tr>
            <tr>
              <td style={{color:'#718096',paddingBottom:2}}>DT.Valid.:</td>
              <td style={{fontWeight:700,fontSize:12,color:'#9B2C2C',paddingBottom:2}}>{e.validade||'—'}</td>
              <td style={{color:'#718096'}}>DCB:</td>
              <td style={{fontWeight:600}}>{e.dcb||'n/d'}</td>
            </tr>
            {fatorDiff&&(
              <tr>
                <td style={{color:'#718096',paddingBottom:2}}>F.Corr.:</td>
                <td colSpan={3} style={{fontWeight:700,fontSize:13,color:'#9B2C2C',paddingBottom:2}}>{e.fator}</td>
              </tr>
            )}
            {!fatorDiff&&(
              <tr>
                <td style={{color:'#718096',paddingBottom:2}}>F.Corr.:</td>
                <td style={{fontWeight:600,paddingBottom:2}}>{e.fator||'—'}</td>
                <td style={{color:'#718096'}}>Orig.:</td>
                <td style={{fontWeight:600}}>{e.origem||'—'}</td>
              </tr>
            )}
            <tr>
              <td style={{color:'#718096',paddingBottom:2}}>Fornec.:</td>
              <td colSpan={2} style={{fontWeight:600,paddingBottom:2}}>{e.fornecedor}</td>
              <td></td>
            </tr>
            <tr>
              <td style={{color:'#718096',paddingBottom:2}}>Lote:</td>
              <td style={{fontWeight:600,paddingBottom:2}}>{e.lote}</td>
              <td style={{color:'#718096'}}>Dens.:</td>
              <td style={{fontWeight:600}}>{e.densidade||'—'}</td>
            </tr>
            <tr>
              <td style={{color:'#718096',paddingBottom:2}}>Qtde.:</td>
              <td style={{fontWeight:600,paddingBottom:2}}>{e.qtde}</td>
              <td style={{color:'#718096'}}>Teor:</td>
              <td style={{fontWeight:600}}>{e.teor_fab||e.teor||'—'}</td>
            </tr>
            <tr>
              <td style={{color:'#718096'}}>CAS:</td>
              <td colSpan={3} style={{fontWeight:600,fontSize:9}}>{e.cas||'—'}</td>
            </tr>
          </tbody>
        </table>
        <div style={{marginTop:5,borderTop:'1px solid #E2E8F0',paddingTop:4}}>
          <div style={{fontSize:9,fontWeight:700,color:'#4A5568',marginBottom:2,textTransform:'uppercase'}}>Armazenamento</div>
          <div style={{fontSize:9,color:'#2D3748',lineHeight:1.4}}>{(e.armazenamento||'—').substring(0,80)}{e.armazenamento?.length>80?'…':''}</div>
        </div>
        <div style={{marginTop:4,borderTop:'1px solid #E2E8F0',paddingTop:3,display:'flex',flexWrap:'wrap',gap:'2px 6px',fontSize:9}}>
          {[['port344','Port.344'],['termossens','Termoss.'],['fotossens','Fotoss.'],
            ['higro','Higro.'],['hormonio','Horm.'],['citostatico','Cito.'],['antibiotico','Antib.']].map(([k,l])=>(
            <span key={k} style={{color:e[k]?'#1A3A5C':'#CBD5E0',fontWeight:e[k]?700:400}}>{check(e[k])} {l}</span>
          ))}
        </div>
      </div>
    );
  };

  return(
    <div>
      {/* Selection Panel */}
      <div className="no-print card" style={{marginBottom:16,padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div>
            <div style={{fontWeight:700,fontSize:14,color:'#1A3A5C'}}>Selecionar Etiquetas para Impressão</div>
            <div style={{fontSize:12,color:'#718096',marginTop:2}}>{numCodes}/8 laudos · {totalEtiq}/8 etiquetas · Máximo 8 por folha A4</div>
          </div>
          {etiqList.length>0&&(
            <button className="btn btn-primary" onClick={()=>window.print()}>🖨️ Imprimir {etiqList.length} etiqueta{etiqList.length>1?'s':''}</button>
          )}
        </div>

        {/* Selected items */}
        {Object.keys(selections).length>0&&(
          <div style={{background:'#EBF4FB',borderRadius:8,padding:'10px 12px',marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:700,color:'#1A3A5C',marginBottom:8}}>SELECIONADOS:</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {entries.filter(e=>selections[e.id]).map(e=>(
                <div key={e.id} style={{display:'flex',alignItems:'center',gap:6,background:'#fff',border:'1px solid #BEE3F8',borderRadius:6,padding:'4px 10px'}}>
                  <span style={{fontWeight:600,fontSize:12,color:'#1A3A5C'}}>{e.re}/{e.ano}</span>
                  <span style={{fontSize:11,color:'#718096',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.substancia}</span>
                  <span style={{fontSize:11,color:'#4A5568'}}>×</span>
                  <select value={selections[e.id]} onChange={ev=>setQty(e.id,parseInt(ev.target.value))}
                    style={{width:50,padding:'2px 4px',fontSize:12,border:'1px solid #CBD5E0',borderRadius:4}}>
                    {[1,2,3,4,5,6,7,8].map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                  <button onClick={()=>toggleEntry(e)} style={{background:'none',border:'none',color:'#E53E3E',fontWeight:700,fontSize:14,padding:'0 2px'}}>×</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Search + list */}
        <div style={{marginBottom:8}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar laudo por produto ou RE..." />
        </div>
        <div style={{maxHeight:260,overflowY:'auto',border:'1px solid #E2E8F0',borderRadius:8}}>
          {filtered.length===0&&<div style={{padding:20,textAlign:'center',color:'#A0AEC0',fontSize:13}}>Nenhuma entrada encontrada.</div>}
          {filtered.map(e=>{
            const sel=!!selections[e.id];
            const full=!sel&&(numCodes>=8||totalEtiq>=8);
            return(
              <div key={e.id} onClick={()=>!full&&toggleEntry(e)}
                style={{padding:'8px 14px',borderBottom:'1px solid #EEF2F7',cursor:full?'not-allowed':'pointer',background:sel?'#EBF4FB':'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',opacity:full?0.5:1}}
                onMouseEnter={e=>!full&&(e.currentTarget.style.background=sel?'#D6EAF8':'#F7FAFC')}
                onMouseLeave={e=>e.currentTarget.style.background=sel?'#EBF4FB':'#fff'}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:18,height:18,borderRadius:4,border:'2px solid #CBD5E0',background:sel?'#1A3A5C':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    {sel&&<span style={{color:'#fff',fontSize:12}}>✓</span>}
                  </div>
                  <div>
                    <span style={{fontWeight:700,fontSize:12,color:'#1A3A5C'}}>RE {e.re}/{e.ano}</span>
                    <span style={{fontSize:12,color:'#4A5568',marginLeft:8}}>{e.substancia}</span>
                  </div>
                </div>
                <div style={{fontSize:11,color:'#718096'}}>{e.fornecedor} · {e.validade||'—'}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Preview / Print area */}
      {etiqList.length>0&&(
        <div>
          <div className="no-print" style={{fontWeight:700,fontSize:13,color:'#4A5568',marginBottom:10}}>Prévia de impressão:</div>
          <div className="etiq-page">
            <div className="etiq-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {etiqList.map((e,i)=><EtiqCard key={i} e={e} />)}
            </div>
          </div>
        </div>
      )}
      {etiqList.length===0&&(
        <div className="no-print" style={{textAlign:'center',padding:40,color:'#A0AEC0',border:'2px dashed #E2E8F0',borderRadius:12}}>
          <div style={{fontSize:40,marginBottom:10}}>🏷️</div>
          <div style={{fontSize:14}}>Selecione laudos acima para pré-visualizar e imprimir as etiquetas.</div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════ GERENCIAR COMPONENT ══════════════════ */
function Gerenciar({userDB,onSaveUserDB,entries,onImportEntries}){
  const [subTab,setSubTab]=useState('sub');
  const [newSub,setNewSub]=useState({n:'',d:'',s:'',a:'',tm:'',dn:'',tr:'',fn:''});
  const [search,setSearch]=useState('');
  const [msg,setMsg]=useState('');
  const importRef=useRef();
  const importEntriesRef=useRef();

  function addSub(){
    if(!newSub.n.trim()){alert('Nome obrigatório.');return;}
    const item={...newSub,c:'U'+Date.now()};
    const updated=[...userDB,item];
    onSaveUserDB(updated);
    setNewSub({n:'',d:'',s:'',a:'',tm:'',dn:'',tr:'',fn:''});
    setMsg('Substância adicionada com sucesso!');
    setTimeout(()=>setMsg(''),3000);
  }
  function delSub(c){
    if(!confirm('Remover esta substância?'))return;
    onSaveUserDB(userDB.filter(s=>s.c!==c));
  }

  function exportDB(){
    const all=[...EMBEDDED_DB,...userDB];
    const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='substancias_cq.json';a.click();
  }
  function exportEntries(){
    const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='historico_cq.json';a.click();
  }
  function importDB(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!Array.isArray(data))throw new Error();
        // only keep ones not in embedded
        const embCodes=new Set(EMBEDDED_DB.map(s=>s.c));
        const newOnes=data.filter(s=>s.n&&!embCodes.has(s.c)).map(s=>({...s,c:'U'+s.c}));
        onSaveUserDB([...userDB,...newOnes]);
        setMsg(`${newOnes.length} novas substâncias importadas!`);
        setTimeout(()=>setMsg(''),4000);
      }catch{alert('Arquivo inválido.');}
    };
    reader.readAsText(file);
    e.target.value='';
  }
  function importEntries(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!Array.isArray(data))throw new Error();
        onImportEntries(data);
        setMsg(`${data.length} entradas importadas com sucesso!`);
        setTimeout(()=>setMsg(''),4000);
      }catch{alert('Arquivo inválido.');}
    };
    reader.readAsText(file);
    e.target.value='';
  }

  const allSubs=[...EMBEDDED_DB,...userDB];
  const filtered=search?allSubs.filter(s=>s.n.toLowerCase().includes(search.toLowerCase())):allSubs;

  return(
    <div>
      <div style={{display:'flex',gap:6,marginBottom:16}}>
        {[['sub','📦 Substâncias'],['imp','📥 Importar/Exportar']].map(([k,l])=>(
          <button key={k} onClick={()=>setSubTab(k)} className={`btn ${subTab===k?'btn-primary':'btn-ghost'}`}>{l}</button>
        ))}
      </div>

      {msg&&<div className="alert-success">{msg}</div>}

      {subTab==='sub'&&(
        <div>
          <div className="section sec-blue" style={{marginBottom:16}}>
            <div className="sec-title" style={{color:'#1A3A5C'}}>Adicionar Nova Substância</div>
            <div className="grid3" style={{marginBottom:8}}>
              <Field label="Nome *" value={newSub.n} onChange={v=>setNewSub(s=>({...s,n:v}))} />
              <Field label="DCB" value={newSub.d} onChange={v=>setNewSub(s=>({...s,d:v}))} />
              <Field label="CAS" value={newSub.s} onChange={v=>setNewSub(s=>({...s,s:v}))} />
              <Field label="Temperatura" value={newSub.tm} onChange={v=>setNewSub(s=>({...s,tm:v}))} />
              <Field label="Densidade" value={newSub.dn} onChange={v=>setNewSub(s=>({...s,dn:v}))} />
              <Field label="Teor / Fator" value={newSub.fn} onChange={v=>setNewSub(s=>({...s,fn:v}))} />
            </div>
            <div style={{marginBottom:8}}>
              <Field label="Armazenamento" value={newSub.a} onChange={v=>setNewSub(s=>({...s,a:v}))} />
            </div>
            <button className="btn btn-primary" onClick={addSub}>+ Adicionar Substância</button>
          </div>

          <div style={{marginBottom:10}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={`Buscar nas ${allSubs.length} substâncias cadastradas...`} />
          </div>
          <div style={{maxHeight:380,overflowY:'auto',border:'1px solid #E2E8F0',borderRadius:8}}>
            {filtered.map((s,i)=>{
              const isUser=s.c.startsWith('U');
              return(
                <div key={s.c+i} style={{padding:'8px 14px',borderBottom:'1px solid #EEF2F7',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <span style={{fontWeight:600,fontSize:13}}>{s.n}</span>
                    {isUser&&<span style={{marginLeft:6,fontSize:10,background:'#EBF4FB',color:'#1A3A5C',padding:'1px 6px',borderRadius:10,fontWeight:600}}>Adicionada</span>}
                    <div style={{fontSize:11,color:'#718096',marginTop:2}}>
                      {s.d&&<span>DCB: {s.d} · </span>}{s.s&&<span>CAS: {s.s}</span>}
                    </div>
                  </div>
                  {isUser&&<button className="btn btn-sm btn-danger" onClick={()=>delSub(s.c)}>Remover</button>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {subTab==='imp'&&(
        <div>
          <div className="section sec-green" style={{marginBottom:16}}>
            <div className="sec-title" style={{color:'#276749'}}>📥 Importar Histórico de Laudos</div>
            <p style={{fontSize:13,marginBottom:12,color:'#4A5568'}}>Importe o arquivo <b>historico_cq.json</b> para carregar as 377 entradas dos anos 2022–2026 no sistema.</p>
            <input ref={importEntriesRef} type="file" accept=".json" onChange={importEntries} style={{display:'none'}} />
            <button className="btn btn-primary" onClick={()=>importEntriesRef.current.click()}>📂 Selecionar historico_cq.json</button>
          </div>

          <div className="section sec-blue" style={{marginBottom:16}}>
            <div className="sec-title" style={{color:'#1A3A5C'}}>📥 Importar Banco de Substâncias</div>
            <p style={{fontSize:13,marginBottom:12,color:'#4A5568'}}>Importe um arquivo JSON com substâncias adicionais. Novas substâncias são adicionadas ao banco existente.</p>
            <input ref={importRef} type="file" accept=".json" onChange={importDB} style={{display:'none'}} />
            <button className="btn btn-ghost" onClick={()=>importRef.current.click()}>📂 Selecionar JSON de substâncias</button>
          </div>

          <div className="section sec-yellow">
            <div className="sec-title" style={{color:'#744210'}}>📤 Exportar Dados</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-ghost" onClick={exportDB}>💾 Exportar Banco de Substâncias</button>
              <button className="btn btn-ghost" onClick={exportEntries}>💾 Exportar Histórico de Laudos ({entries.length} entradas)</button>
            </div>
            <p style={{fontSize:11,color:'#718096',marginTop:8}}>Salve os arquivos exportados como backup ou para transferir para outro dispositivo.</p>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════ MAIN APP ══════════════════ */
export default function App(){
  const [tab,setTab]=useState('entrada');
  const [form,setForm]=useState(blank());
  const [entries,setEntries]=useState(()=>LS.getEntries());
  const [userDB,setUserDB]=useState(()=>LS.getUserDB());
  const [current,setCurrent]=useState(null);
  const [saved,setSaved]=useState(false);
  const [histSearch,setHistSearch]=useState('');

  const fullDB=[...EMBEDDED_DB,...userDB];
  const f=k=>v=>setForm(p=>({...p,[k]:v}));

  function handleSelect(spec){
    setForm(p=>({...p,
      substancia:spec.n,codigo:spec.c,
      dcb:spec.d||p.dcb,cas:spec.s||p.cas,
      armazenamento:spec.a||p.armazenamento,
      temperatura:spec.tm||p.temperatura,
      densidade:spec.dn||p.densidade,
      densidade_ref:spec.dn||p.densidade_ref,
      teor:spec.tr||p.teor,
      teor_ref:spec.tr||p.teor_ref,
      fator:spec.fn||p.fator,
    }));
  }

  function nextRE(){
    const yr=new Date().getFullYear().toString().slice(-2);
    return String(entries.filter(e=>e.ano===yr).length+1).padStart(3,'0');
  }

  function handleSave(){
    const re=form.re||nextRE();
    const entry={...form,re,id:Date.now()};
    const updated=[entry,...entries];
    setEntries(updated);LS.saveEntries(updated);
    setCurrent(entry);setSaved(true);
    setTimeout(()=>setSaved(false),3000);
    setTab('laudo');
  }

  function handleSaveUserDB(list){setUserDB(list);LS.saveUserDB(list);}

  function handleImportEntries(newEntries){
    const existing=new Set(entries.map(e=>e.id));
    const toAdd=newEntries.filter(e=>!existing.has(e.id));
    const updated=[...toAdd,...entries];
    setEntries(updated);LS.saveEntries(updated);
  }

  function handleDelete(id){
    if(!confirm('Excluir esta entrada do histórico?'))return;
    const updated=entries.filter(e=>e.id!==id);
    setEntries(updated);LS.saveEntries(updated);
    if(current&&current.id===id)setCurrent(null);
  }

  const filteredHist=histSearch
    ?entries.filter(e=>e.substancia?.toLowerCase().includes(histSearch.toLowerCase())||e.re?.includes(histSearch)||e.fornecedor?.toLowerCase().includes(histSearch.toLowerCase()))
    :entries;

  const TABS=[['entrada','📝 Nova Entrada'],['laudo','🔬 Laudo'],['etiqueta','🏷️ Etiquetas'],['historico','📚 Histórico'],['gerenciar','⚙️ Gerenciar']];

  return(
    <div style={{maxWidth:900,margin:'0 auto',padding:'16px 12px'}}>
      {/* HEADER */}
      <div className="no-print card" style={{marginBottom:0}}>
        <div style={{background:'linear-gradient(135deg,#1A3A5C,#2B6CB0)',color:'#fff',padding:'14px 22px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontSize:17,fontWeight:700,letterSpacing:.3}}>🔬 CQ Fórmula Animal</div>
            <div style={{fontSize:11,opacity:.65,marginTop:2}}>{fullDB.length} substâncias · {entries.length} entradas registradas</div>
          </div>
          <button onClick={()=>{setForm(blank());setCurrent(null);setTab('entrada');}} className="btn" style={{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.3)',color:'#fff'}}>
            + Nova entrada
          </button>
        </div>
        <div style={{display:'flex',borderBottom:'2px solid #E2E8F0',overflowX:'auto'}}>
          {TABS.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)}
              style={{flex:1,minWidth:80,padding:'11px 8px',border:'none',background:'transparent',fontSize:12,fontWeight:tab===k?700:400,color:tab===k?'#1A3A5C':'#718096',borderBottom:tab===k?'3px solid #1A3A5C':'3px solid transparent',whiteSpace:'nowrap'}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* BODY */}
      <div className="card" style={{padding:18}}>

        {/* ── ENTRADA ── */}
        {tab==='entrada'&&(
          <div>
            {saved&&<div className="alert-success">✅ Salvo! Laudo e etiqueta disponíveis nas abas ao lado.</div>}

            <div className="section sec-blue">
              <div className="sec-title" style={{color:'#1A3A5C'}}>Identificação</div>
              <div className="grid2">
                <Field label="R.E. (auto se vazio)" value={form.re} onChange={f('re')} note={'Próximo: '+nextRE()} />
                <Field label="Ano (2 dígitos)" value={form.ano} onChange={f('ano')} />
              </div>
            </div>

            <div style={{marginBottom:12}}>
              <label className="label">Substância / Produto *</label>
              <Search value={form.substancia} onChange={f('substancia')} onSelect={handleSelect} db={fullDB} />
              <div style={{fontSize:10,color:'#A0AEC0',marginTop:3}}>Busca nos {fullDB.length} produtos — DCB, CAS, armazenamento e teor preenchem automaticamente</div>
            </div>

            <div className="grid3" style={{marginBottom:4}}>
              <Field label="Código" value={form.codigo} onChange={f('codigo')} />
              <Field label="DCB" value={form.dcb} onChange={f('dcb')} />
              <Field label="CAS" value={form.cas} onChange={f('cas')} />
            </div>

            <div className="section sec-green">
              <div className="sec-title" style={{color:'#276749'}}>Compra / Nota Fiscal</div>
              <div className="grid3">
                <Field label="Fornecedor" value={form.fornecedor} onChange={f('fornecedor')} options={FORNECEDORES} />
                <Field label="Nota Fiscal" value={form.nf} onChange={f('nf')} />
                <Field label="Quantidade" value={form.qtde} onChange={f('qtde')} />
                <Field label="Lote" value={form.lote} onChange={f('lote')} />
                <Field label="Data Fabricação" value={form.fabricacao} onChange={f('fabricacao')} type="date" />
                <Field label="Data Validade *" value={form.validade} onChange={f('validade')} type="date" />
                <Field label="Data Fracionamento" value={form.fracionamento} onChange={f('fracionamento')} type="date" />
                <Field label="Origem" value={form.origem} onChange={f('origem')} options={ORIGENS} />
              </div>
            </div>

            <div className="section sec-yellow">
              <div className="sec-title" style={{color:'#744210'}}>Dados Técnicos</div>
              <div className="grid3">
                <Field label="Armazenamento" value={form.armazenamento} onChange={f('armazenamento')} />
                <Field label="Temperatura" value={form.temperatura} onChange={f('temperatura')} />
                <Field label="Fator de Correção" value={form.fator} onChange={f('fator')} />
                <Field label="Teor Referência" value={form.teor_ref} onChange={f('teor_ref')} />
                <Field label="Teor Laudo Fabricante" value={form.teor_fab} onChange={f('teor_fab')} />
              </div>
            </div>

            <div className="section sec-red">
              <div className="sec-title" style={{color:'#9B2C2C'}}>Aspectos Gerais</div>
              <Conf label="Laudo do Fornecedor" value={form.laudo_forn} onChange={f('laudo_forn')} />
              <Conf label="Peso / Vol. do Produto" value={form.peso_vol} onChange={f('peso_vol')} />
              <Conf label="Rótulo do Fornecedor" value={form.rotulo} onChange={f('rotulo')} />
            </div>

            <div className="section sec-gray">
              <div className="sec-title" style={{color:'#2D3748'}}>Testes de Identificação</div>
              <TesteRow label="Características Organolépticas"
                refVal={form.organoleptica_ref} onRefChange={f('organoleptica_ref')}
                resultVal={form.organoleptica_result} onResultChange={f('organoleptica_result')}
                confVal={form.organoleptica_conf} onConfChange={f('organoleptica_conf')} />
              <TesteRow label="Solubilidade"
                refVal={form.solubilidade_ref} onRefChange={f('solubilidade_ref')}
                resultVal={form.solubilidade_result} onResultChange={f('solubilidade_result')}
                confVal={form.solubilidade_conf} onConfChange={f('solubilidade_conf')} />
              <TesteRow label="Ponto de Fusão"
                refVal={form.fusao_ref} onRefChange={f('fusao_ref')}
                resultVal={form.fusao_result} onResultChange={f('fusao_result')}
                confVal={form.fusao_conf} onConfChange={f('fusao_conf')} />
              <TesteRow label="Densidade"
                refVal={form.densidade_ref||form.densidade} onRefChange={f('densidade_ref')}
                resultVal={form.densidade_result} onResultChange={f('densidade_result')}
                confVal={form.densidade_conf} onConfChange={f('densidade_conf')} />
              <TesteRow label="pH"
                refVal={form.ph_ref} onRefChange={f('ph_ref')}
                resultVal={form.ph_result} onResultChange={f('ph_result')}
                confVal={form.ph_conf} onConfChange={f('ph_conf')} />
            </div>

            <div className="section sec-blue">
              <div className="sec-title" style={{color:'#1A3A5C'}}>Classificações (Etiqueta)</div>
              <div className="grid3">
                {[['port344','Port. 344'],['termossens','Termossensível'],['fotossens','Fotossensível'],
                  ['higro','Higroscópico'],['hormonio','Hormônio'],['citostatico','Citostático'],['antibiotico','Antibiótico']].map(([k,l])=>(
                  <label key={k} className={`tag ${form[k]?'tag-on':''}`}>
                    <input type="checkbox" checked={!!form[k]} onChange={e=>f(k)(e.target.checked)} style={{width:'auto',margin:0}} />{l}
                  </label>
                ))}
              </div>
            </div>

            <div className="section sec-gray">
              <div className="sec-title" style={{color:'#2D3748'}}>Resultado Final</div>
              <div style={{display:'flex',gap:10,marginBottom:12}}>
                {[['A','✅ Aprovado','#276749','#F0FFF4','#38A169'],
                  ['Q','🟡 Quarentena','#744210','#FFFBEB','#D69E2E'],
                  ['R','❌ Reprovado','#9B2C2C','#FFF5F5','#E53E3E']].map(([v,l,c,bg,bdr])=>(
                  <label key={v} style={{flex:1,display:'flex',alignItems:'center',gap:8,padding:'9px 14px',borderRadius:8,cursor:'pointer',border:`2px solid ${form.resultado===v?bdr:'#E2E8F0'}`,background:form.resultado===v?bg:'#fff',fontWeight:700}}>
                    <input type="radio" value={v} checked={form.resultado===v} onChange={()=>f('resultado')(v)} style={{width:'auto',margin:0}} />
                    <span style={{color:c,fontSize:13}}>{l}</span>
                  </label>
                ))}
              </div>
              <div className="grid2">
                <Field label="Analisado por" value={form.analisado} onChange={f('analisado')} />
                <Field label="Observações" value={form.obs} onChange={f('obs')} />
              </div>
            </div>

            <button className="btn btn-primary" onClick={handleSave} style={{width:'100%',padding:'14px',fontSize:14,letterSpacing:.3}}>
              💾 Salvar Entrada → Gerar Laudo e Etiqueta
            </button>
          </div>
        )}

        {tab==='laudo'&&<Laudo e={current} onPrint={()=>window.print()} />}
        {tab==='etiqueta'&&<Etiquetas entries={entries} />}

        {/* ── HISTÓRICO ── */}
        {tab==='historico'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:14,color:'#1A3A5C'}}>{entries.length} entrada{entries.length!==1?'s':''}</div>
              <input value={histSearch} onChange={e=>setHistSearch(e.target.value)} placeholder="Buscar por produto, RE, fornecedor..." style={{width:280}} />
            </div>
            {entries.length===0&&(
              <div style={{textAlign:'center',padding:60,color:'#A0AEC0',border:'2px dashed #E2E8F0',borderRadius:12}}>
                <div style={{fontSize:40,marginBottom:10}}>📋</div>
                <div style={{fontSize:14}}>Nenhuma entrada. Importe o historico_cq.json na aba ⚙️ Gerenciar.</div>
              </div>
            )}
            {filteredHist.map(e=>(
              <div key={e.id}
                style={{border:'1px solid #E2E8F0',borderRadius:10,padding:'10px 14px',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',background:'#fff'}}
                onMouseEnter={el=>el.currentTarget.style.background='#EBF4FB'}
                onMouseLeave={el=>el.currentTarget.style.background='#fff'}
                onClick={()=>{setCurrent(e);setForm(e);setTab('entrada');}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,color:'#1A3A5C'}}>RE {e.re}/{e.ano} — {e.substancia}</div>
                  <div style={{fontSize:11,color:'#718096',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {e.fornecedor} · Lote {e.lote} · Val. <b style={{color:'#9B2C2C'}}>{e.validade||'—'}</b> · <span style={{color:resColor(e.resultado),fontWeight:600}}>{resText(e.resultado)}</span>
                  </div>
                </div>
                <div style={{display:'flex',gap:6,marginLeft:10}}>
                  <button className="btn btn-sm btn-ghost" onClick={ev=>{ev.stopPropagation();setCurrent(e);setTab('laudo');}}>Laudo</button>
                  <button className="btn btn-sm btn-ghost" onClick={ev=>{ev.stopPropagation();setCurrent(e);setTab('etiqueta');}}>Etiqueta</button>
                  <button className="btn btn-sm btn-danger" onClick={ev=>{ev.stopPropagation();handleDelete(e.id);}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==='gerenciar'&&(
          <Gerenciar userDB={userDB} onSaveUserDB={handleSaveUserDB} entries={entries} onImportEntries={handleImportEntries} />
        )}
      </div>

      <div className="no-print" style={{textAlign:'center',fontSize:11,color:'#A0AEC0',marginTop:12}}>
        CQ Fórmula Animal · Dados salvos localmente neste navegador
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
